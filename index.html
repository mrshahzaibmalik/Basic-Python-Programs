<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basic Python Program By Shahzaib Malik</title>
<style>
:root{
  --bg:#12151b;
  --panel:#181c24;
  --panel-2:#1e232d;
  --line:rgba(255,255,255,0.08);
  --line-strong:rgba(255,255,255,0.16);
  --text:#dfe3ea;
  --text-dim:#8992a3;
  --accent:#e8a33d;
  --accent-dim:#8a6423;
  --keyword:#7fb0e0;
  --string:#9bd6a4;
  --comment:#5f6779;
  --number:#e0956f;
  --paper:#f4efe1;
  --paper-2:#eae3cf;
  --ink:#2c2820;
  --ink-dim:#726b58;
  --danger:#e0705f;
  --mono: ui-monospace, "Cascadia Code", "SF Mono", "JetBrains Mono", Consolas, "Roboto Mono", monospace;
  --sans: -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  padding-bottom:36px;
}

a{color:inherit;}

/* ---------- layout shell ---------- */
.app{
  display:grid;
  grid-template-columns:280px 1fr;
  grid-template-rows:auto 1fr;
  grid-template-areas:
    "header header"
    "sidebar main";
  min-height:100vh;
}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-areas:"header" "sidebar" "main";}
}

/* ---------- header ---------- */
.header{
  grid-area:header;
  padding:22px 28px 18px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:baseline;
  gap:16px;
  flex-wrap:wrap;
}
.header .brand-mark{
  font-family:var(--mono);
  font-size:13px;
  letter-spacing:0.12em;
  color:var(--accent);
  border:1px solid var(--accent-dim);
  padding:3px 8px;
  border-radius:3px;
  text-transform:uppercase;
}
.header h1{
  font-size:19px;
  font-weight:600;
  margin:0;
  letter-spacing:-0.01em;
}
.header p{
  margin:0;
  color:var(--text-dim);
  font-size:13px;
  flex-basis:100%;
}

/* ---------- sidebar ---------- */
.sidebar{
  grid-area:sidebar;
  border-right:1px solid var(--line);
  overflow-y:auto;
  max-height:calc(100vh - 78px);
  padding:16px 0 40px;
}
@media (max-width:860px){
  .sidebar{max-height:min(50vh, 420px);border-right:none;border-bottom:1px solid var(--line);}
}

.search-wrap{
  padding:0 16px 14px;
  position:sticky;
  top:0;
  background:var(--bg);
  z-index:5;
}
.search-wrap input{
  width:100%;
  background:var(--panel);
  border:1px solid var(--line-strong);
  color:var(--text);
  font-family:var(--mono);
  font-size:13px;
  padding:9px 10px;
  border-radius:6px;
  outline:none;
}
.search-wrap input:focus{border-color:var(--accent);}
.search-wrap input::placeholder{color:var(--text-dim);}

.part-group{margin-bottom:4px;}
.part-toggle{
  width:100%;
  text-align:left;
  background:none;
  border:none;
  color:var(--text-dim);
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  padding:10px 16px 6px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.part-toggle:hover{color:var(--text);}
.part-toggle .chev{transition:transform .15s ease;font-size:10px;}
.part-group.collapsed .chev{transform:rotate(-90deg);}
.part-list{list-style:none;margin:0;padding:0 8px 6px;}
.part-group.collapsed .part-list{display:none;}

.prog-item{
  display:flex;
  align-items:baseline;
  gap:8px;
  width:100%;
  text-align:left;
  background:none;
  border:none;
  color:var(--text);
  padding:6px 8px;
  font-size:13px;
  border-radius:5px;
  cursor:pointer;
  font-family:var(--sans);
}
.prog-item:hover{background:var(--panel);}
.prog-item.active{background:var(--panel-2);color:var(--accent);}
.prog-item .n{
  font-family:var(--mono);
  color:var(--text-dim);
  font-size:11px;
  min-width:22px;
}
.prog-item.active .n{color:var(--accent);}

/* ---------- main ---------- */
.main{
  grid-area:main;
  padding:26px 28px 60px;
  overflow-y:auto;
  max-height:calc(100vh - 78px);
}
@media (max-width:860px){.main{max-height:none;}}

.prog-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.prog-eyebrow{
  font-family:var(--mono);
  font-size:11px;
  color:var(--accent);
  letter-spacing:0.08em;
  text-transform:uppercase;
  margin:0 0 6px;
}
.prog-title{
  font-size:24px;
  font-weight:600;
  margin:0;
  letter-spacing:-0.01em;
}
.prog-flags{
  display:flex;
  gap:6px;
  margin-top:8px;
}
.flag{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--text-dim);
  border:1px solid var(--line-strong);
  padding:2px 7px;
  border-radius:20px;
}

.run-btn{
  font-family:var(--mono);
  font-size:13px;
  font-weight:600;
  color:#1a1406;
  background:var(--accent);
  border:none;
  padding:10px 20px;
  border-radius:6px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  transition:filter .15s ease, transform .05s ease;
}
.run-btn:hover{filter:brightness(1.08);}
.run-btn:active{transform:scale(0.98);}
.run-btn:disabled{opacity:0.55;cursor:progress;}
.run-status{
  font-family:var(--mono);
  font-size:11.5px;
  color:var(--text-dim);
  margin-top:6px;
  min-height:14px;
}

/* ---------- split panes ---------- */
.panes{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  align-items:start;
}
@media (max-width:980px){.panes{grid-template-columns:1fr;}}

.pane-label{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--text-dim);
  margin:0 0 8px;
  display:flex;
  align-items:center;
  gap:8px;
}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.dot.code{background:var(--keyword);}
.dot.paper{background:var(--accent);}

/* code editor pane */
.editor{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
}
.editor-bar{
  display:flex;
  gap:6px;
  padding:10px 12px;
  border-bottom:1px solid var(--line);
}
.editor-bar span{width:9px;height:9px;border-radius:50%;background:var(--line-strong);}
.editor pre{
  margin:0;
  padding:16px;
  font-family:var(--mono);
  font-size:13px;
  line-height:1.65;
  overflow-x:auto;
  white-space:pre;
}
.kw{color:var(--keyword);}
.st{color:var(--string);}
.cm{color:var(--comment);font-style:italic;}
.nm{color:var(--number);}
.fn{color:#d0a8e8;}

/* output / printer pane */
.printer{
  position:relative;
  background:var(--paper);
  border-radius:2px;
  color:var(--ink);
  box-shadow:0 12px 28px rgba(0,0,0,0.35);
}
.printer::before{
  content:"";
  display:block;
  height:12px;
  background-image:radial-gradient(circle at 8px 6px, var(--bg) 5px, transparent 5.5px);
  background-size:16px 12px;
  background-repeat:repeat-x;
  background-position:-2px 0;
}
.printer-inner{padding:6px 18px 20px;}
.printer-meta{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--ink-dim);
  display:flex;
  justify-content:space-between;
  border-bottom:1px dashed var(--paper-2);
  padding-bottom:8px;
  margin-bottom:10px;
}
.printer-body{
  font-family:var(--mono);
  font-size:13px;
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-word;
  min-height:64px;
}
.printer-body .cursor{
  display:inline-block;
  width:7px;height:14px;
  background:var(--ink);
  vertical-align:-2px;
  animation:blink 1s steps(1) infinite;
}
@keyframes blink{50%{opacity:0;}}
.printer-placeholder{color:var(--ink-dim);font-style:italic;}
.printer-error{color:#a83b2c;}

.note{
  font-size:12px;
  color:var(--text-dim);
  margin-top:14px;
  line-height:1.6;
  max-width:70ch;
}
.note b{color:var(--text);}

.empty-state{color:var(--text-dim);font-family:var(--mono);font-size:13px;}

::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

.footer-note{
  margin-top:40px;
  padding-top:16px;
  border-top:1px solid var(--line);
  font-size:12px;
  color:var(--text-dim);
  font-family:var(--mono);
}

/* ---------- connect bar (main screen, below printout) ---------- */
/* ---------- promo banner (fills space below output) ---------- */
.promo-banner{
  margin-top:26px;
  border:1px solid var(--accent-dim);
  border-left:3px solid var(--accent);
  border-radius:10px;
  background:linear-gradient(135deg, rgba(232,163,61,0.08), rgba(232,163,61,0.02));
  padding:22px 24px;
}
.promo-eyebrow{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--accent);
  margin:0 0 8px;
}
.promo-title{
  font-size:18px;
  font-weight:700;
  margin:0 0 6px;
  color:var(--text);
}
.promo-body{
  font-size:13.5px;
  color:var(--text-dim);
  margin:0 0 16px;
  line-height:1.6;
  max-width:56ch;
}
.promo-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}
.promo-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  text-decoration:none;
  font-family:var(--sans);
  font-weight:600;
  font-size:13px;
  padding:10px 18px;
  border-radius:8px;
  transition:filter .15s ease, transform .05s ease;
}
.promo-btn:active{transform:scale(0.98);}
.promo-btn.primary{background:var(--accent);color:#1a1406;}
.promo-btn.primary:hover{filter:brightness(1.08);}
.promo-btn.secondary{background:transparent;border:1px solid var(--line-strong);color:var(--text);}
.promo-btn.secondary:hover{border-color:var(--accent);color:var(--accent);}

.connect-bar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:22px;
  padding-top:18px;
  border-top:1px solid var(--line);
}
.connect-link{
  display:inline-flex;
  align-items:center;
  gap:7px;
  text-decoration:none;
  color:var(--text-dim);
  background:var(--panel);
  border:1px solid var(--line-strong);
  padding:8px 14px;
  border-radius:20px;
  font-family:var(--sans);
  font-size:12.5px;
  transition:color .15s ease, border-color .15s ease, transform .05s ease;
}
.connect-link svg{flex:none;}
.connect-link:active{transform:scale(0.98);}
.connect-link.yt:hover{color:#ff5252;border-color:#ff5252;}
.connect-link.ig:hover{color:#e0679f;border-color:#e0679f;}
.connect-link.wa:hover{color:#5fd68a;border-color:#5fd68a;}

/* ---------- running marquee footer ---------- */
.marquee-footer{
  position:fixed;
  left:0;right:0;bottom:0;
  height:34px;
  background:var(--panel-2);
  border-top:1px solid var(--line);
  overflow:hidden;
  z-index:80;
  display:flex;
  align-items:center;
}
.marquee-track{
  display:flex;
  align-items:center;
  white-space:nowrap;
  animation:marquee-scroll 24s linear infinite;
}
.marquee-footer:hover .marquee-track{animation-play-state:paused;}
.marquee-group{
  display:flex;
  align-items:center;
  gap:28px;
  padding-right:28px;
}
.marquee-track a{
  color:var(--text-dim);
  font-family:var(--mono);
  font-size:11.5px;
  text-decoration:none;
  letter-spacing:0.02em;
}
.marquee-track a:hover{color:var(--accent);}
.marquee-track .credit{
  font-family:var(--mono);
  font-size:11.5px;
  color:var(--text-dim);
}
.marquee-track .credit b{color:var(--accent);}
.marquee-track .sep{color:var(--line-strong);}
@keyframes marquee-scroll{
  from{transform:translateX(0);}
  to{transform:translateX(-50%);}
}
@media (prefers-reduced-motion: reduce){
  .marquee-track{animation:none;overflow-x:auto;}
}
</style>
</head>

ist", "code": "nums = [10, 20, 30, 40]\nprint(sum(nums) / len(nums))", "output": "25.0", "usesInput": false, "usesRandom": false}, {"id": 64, "part": "Part 4: Lists, Tuples, Dicts, Sets (61\u201380)", "title": "Sort a list", "code": "nums = [5, 2, 8, 1, 9]\nprint(sorted(nums))", "output": "[1, 2, 5, 8, 9]", "usesInput": false, "usesRandom": false}, {"id": 65, "part": "Part 4: Lists, Tuples, Dicts, Sets (61\u201380)", "title": "Reverse a list", "code": "nums = [1, 2, 3, 4, 5]\nprint(nums[::-1])", "output": "[5, 4, 3, 2, 1]", "usesInput": false, "usesRandom": false}, {"id": 66, "part": "Part 4: Lists, Tuples, Dicts, Sets (61\u201380)", "title": "Remove duplicates from a list", "code": "nums = [1, 2, 2, 3, 4, 4, 5]\nprint(list(set(nums)))", "output": "[1, 2, 3, 4, 5]", "usesInput": false, "usesRandom": false}, {"id": 67, "part": "Part 4: Lists, Tuples, Dicts, Sets (61\u201380)", "title": "Find second largest number", "code": "nums = [10, 5, 20, 8, 15]\nunique = sorted(set(nums))\nprint(unique[-2])", "output": "15", "usesInput": false, "usesRandom": false}, {"id": 68, "part": "Part 4: Lists, Tuples, Dicts, Sets (61\u201380)", "title": "Count occurrences of an element", "code": "nums = [1, 2, 2, 3, 2, 4]\nprint(nums.count(2))", "output": "3", "usesInput": false, "usesRandom": false}, {"id": 69, "part": "Part 4: Lists, Tuples, Dicts, Sets (61\u201380)", "title": "Merge two lists", "code": "a, b = [1, 2, 3], [4, 5, 6]\nprint(a + b)", "output": "[1, 2, 3, 4, 5, 6]", "usesInput": false, "usesRandom": false}, {"id": 70, "part": "Part 4: Lists, Tuples, Dicts, Sets (61\u201380)", "title": "List of squares (list comprehension)", "code": "squares = [x**2 for x in range(1, 11)]\nprint(squares)", "output": "[1, 4, 9, 16, 25, 36, 49, 64, 81, 100]", "usesInput": false, "usesRandom": false}, {"id": 71, "part": "Part 4: Lists, Tuples, Dicts, Sets (61\u201380)", "title": "Common elements between two lists", "code": "a, b = [1, 2, 3, 4], [3, 4, 5, 6]\nprint(list(set(a) & set(b)))", "outp <script>
const DATA = JSON.parse(document.getElementById('program-data').textContent);

const KEYWORDS = ["def","return","if","elif","else","for","while","in","not","and","or",
  "import","from","as","class","try","except","finally","with","lambda","pass","break",
  "continue","True","False","None","is","yield","global","raise","assert","del","self"];

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function highlight(code){
  const placeholders = [];
  function stash(html){
    placeholders.push(html);
    return "\u0000" + (placeholders.length - 1) + "\u0001";
  }
  let src = escapeHtml(code);

  // comments
  src = src.replace(/#.*/g, m => stash(`<span class="cm">${m}</span>`));
  // triple + single/double quoted strings (naive, non-multiline-aware enough for these snippets)
  src = src.replace(/("""[\s\S]*?"""|'''[\s\S]*?'''|f?"(?:[^"\\]|\\.)*"|f?'(?:[^'\\]|\\.)*')/g,
    m => stash(`<span class="st">${m}</span>`));
  // numbers
  src = src.replace(/\b\d+(\.\d+)?\b/g, m => stash(`<span class="nm">${m}</span>`));
  // function defs/calls (word followed by '(')
  src = src.replace(/\b([a-zA-Z_]\w*)(?=\()/g, (m, name) => {
    if (KEYWORDS.includes(name)) return m;
    return stash(`<span class="fn">${name}</span>`);
  });
  // keywords
  const kwPattern = new RegExp("\\b(" + KEYWORDS.join("|") + ")\\b", "g");
  src = src.replace(kwPattern, m => stash(`<span class="kw">${m}</span>`));

  src = src.replace(/\u0000(\d+)\u0001/g, (_, i) => placeholders[parseInt(i,10)]);
  return src;
}

  byPart[p.part].push(p);
});

function buildSidebar(filterText){
  partsContainer.innerHTML = "";
  const q = (filterText || "").trim().toLowerCase();
  partsOrder.forEach((partName, idx) => {
    const items = byPart[partName].filter(p =>
      !q || p.title.toLowerCase().includes(q) || String(p.id).includes(q)
    );
    if (q && items.length === 0) return;

    const group = document.createElement('div');
    group.className = 'part-group' + (q ? '' : (idx > 0 ? ' collapsed' : ''));
    group.dataset.part = partName;

    const toggle = document.createElement('button');
    toggle.className = 'part-toggle';
    toggle.innerHTML = `<span>${partName}</span><span class="chev">▾</span>`;
    toggle.onclick = () => group.classList.toggle('collapsed');
    group.appendChild(toggle);

    const list = document.createElement('ul');
    list.className = 'part-list';
    items.forEach(p => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.className = 'prog-item' + (p.id === state.activeId ? ' active' : '');
      btn.dataset.id = p.id;
      btn.innerHTML = `<span class="n">${String(p.id).padStart(3,'0')}</span><span>${escapeHtml(p.title)}</span>`;
      btn.onclick = () => selectProgram(p.id);
      li.appendChild(btn);
      list.appendChild(li);
    });
    group.appendChild(list);
    partsContainer.appendChild(group);
  });
}

// ---------- pyodide (lazy) ----------
function loadPyodideScript(timeoutMs){
  return new Promise((resolve, reject) => {
    if (window.loadPyodide) { resolve(); return; }
    const script = document.createElement('script');
    script.src = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js";
    let done = false;
    const timer = setTimeout(() => {
      if (!done) { done = true; reject(new Error('timeout loading pyodide')); }
    }, timeoutMs);
    script.onload = () => { if (!done) { done = true; clearTimeout(timer); resolve(); } };
    script.onerror = () => { if (!done) { done = true; clearTimeout(timer); reject(new Error('failed to load pyodide script')); } };
    document.head.appendChild(script);
  });
}

async function getPyodide(){
  if (state.pyodide) return state.pyodide;
  await loadPyodideScript(9000);
  const pyodide = await window.loadPyodide({ timeout: 15000 });
  pyodide.globals.set('js_prompt', (promptText) => {
    const val = window.prompt(promptText || 'Input:');
    return val === null ? '' : val;
  });
  state.pyodide = pyodide;
  return pyodide;
}

function indent(code, spaces){
  const pad = ' '.repeat(spaces);
  return code.split('\n').map(line => line.length ? pad + line : line).join('\n');
}

async function runLive(p){
  const pyodide = await getPyodide();
  const wrapped =
`import io, contextlib, builtins
def _js_input(prompt=''):
    return js_prompt(prompt)
builtins.input = _js_input
_buf = io.StringIO()
with contextlib.redirect_stdout(_buf):
${indent(p.code, 4)}
_buf.getvalue()`;
  const result = await pyodide.runPythonAsync(wrapped);
  return result;
}

function typeOut(text, isError){
  const body = document.getElementById('printerBody');
  body.innerHTML = '';
  const span = document.createElement('span');
  if (isError) span.className = 'printer-error';
  body.appendChild(span);
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  body.appendChild(cursor);

  const chars = (text && text.length) ? text.split('') : [];
  let i = 0;
  const step = Math.max(1, Math.floor(chars.length / 220));
  function tick(){
    if (i >= chars.length){
      cursor.remove();
      if (chars.length === 0){
        span.innerHTML = '<span class="printer-placeholder">(no output)</span>';
      }
      return;
    }
    span.textContent += chars.slice(i, i + step).join('');
    i += step;
    requestAnimationFrame(() => setTimeout(tick, 8));
  }
  tick();
}

async function runProgram(p){
  const btn = document.getElementById('runBtn');
  const status = document.getElementById('runStatus');
  const time = document.getElementById('printerTime');
  btn.disabled = true;
  time.textContent = new Date().toLocaleTimeString();

  try{
    status.textContent = 'Booting Python runtime…';
    const output = await runLive(p);
    status.textContent = '● Live run · Pyodide';
    typeOut(output, false);
  }catch(err){
    status.textContent = 'Live runtime unavailable — showing captured output from an earlier run';
    typeOut(p.output, false);
  }finally{
    btn.disabled = false;
  }
}
